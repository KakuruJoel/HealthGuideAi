services:
  - type: web
    name: healthguide-ai-ml
    runtime: python
    pythonVersion: 3.11
    buildCommand: pip install -r requirements.txt && python generate_dataset.py && python train.py
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        scope: run
